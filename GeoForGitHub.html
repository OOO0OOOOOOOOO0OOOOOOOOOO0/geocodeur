<title>Géocodeur : globe et coordonnées GPS</title>
<style>
/* ============ iOS 18 : couleurs système (mode sombre), comme Parcel Noir ============ */
:root{
  --bg:#000; --cell:#1C1C1E; --cell2:#2C2C2E; --cell-hi:#3A3A3C;
  --sep:rgba(84,84,88,.65); --label:#fff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --fill:rgba(118,118,128,.24); --fill2:rgba(120,120,128,.36);
  --tint:#0A84FF; --red:#FF453A; --orange:#FF9F0A; --green:#30D158; --indigo:#5E5CE6;
  --material:rgba(28,28,30,.78);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro","SF Pro Text","SF Pro Display",sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);
  color-scheme:dark;
}
/* Aucun texte sélectionnable, pas de menu d'appui long iOS (seul le champ reste éditable) */
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
::selection{background:transparent}
input::selection{background:rgba(10,132,255,.4)}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none;touch-action:manipulation}
body{font:17px/1.29 var(--sans);color:var(--label);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
svg{display:block}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
input:focus-visible{outline:none}
.material{background:var(--material);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}

/* ============ Globe ============ */
#globe{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.g{position:fixed;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%)}
#halo{background:radial-gradient(closest-side,rgba(10,132,255,0) 0,rgba(10,132,255,0) 75%,rgba(10,132,255,.55) 80%,rgba(10,132,255,.18) 89%,rgba(10,132,255,0) 100%)}
#shade{background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.16),rgba(255,255,255,0) 46%),radial-gradient(circle at 50% 50%,rgba(0,0,0,0) 56%,rgba(0,0,0,.5) 100%)}

/* ============ Barre de recherche (haut) ============ */
#top{position:fixed;z-index:2000;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 0;max-width:600px;margin:0 auto}
#f{display:flex;align-items:center;gap:8px}
.search{flex:1;height:44px;display:flex;align-items:center;gap:7px;padding:0 6px 0 12px;border-radius:13px;color:var(--label2);box-shadow:0 6px 24px rgba(0,0,0,.35)}
.search > svg{width:18px;height:18px;flex:none}
#q{flex:1;min-width:0;height:44px;font:inherit;font-size:17px;color:var(--label);background:none;border:0;outline:0;padding:0;caret-color:var(--tint);-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;-webkit-appearance:none;appearance:none}
#q::placeholder{color:var(--label2)}
#q::-webkit-search-cancel-button,#q::-webkit-search-decoration{-webkit-appearance:none}
#qClear{flex:none;width:32px;height:32px;display:grid;place-items:center;color:var(--label2)}
#qClear svg{width:17px;height:17px}
#cancelSearch{flex:none;height:44px;padding:0 4px;color:var(--tint);font-size:17px;animation:slide-in .25s var(--ease)}
@keyframes slide-in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}

/* Suggestions : liste groupée iOS */
#box{list-style:none;margin:8px 0 0;padding:0;border-radius:13px;overflow:hidden auto;max-height:min(430px,58dvh);box-shadow:0 10px 40px rgba(0,0,0,.5);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#box li{position:relative;display:flex;align-items:center;gap:12px;min-height:60px;padding:9px 14px;cursor:pointer;transition:background-color .25s}
#box li + li::before{content:"";position:absolute;top:0;right:0;left:60px;height:.5px;background:var(--sep)}
#box li.sel,#box li:active{background:rgba(255,255,255,.08);transition:none}
#box .ico{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--red)}
#box .ico svg{width:17px;height:17px}
#box .ico.k-place{background:var(--tint)}
#box .ico.k-biz{background:var(--orange)}
#box .ico.k-recent{background:var(--fill2)}
#box .txt{flex:1;min-width:0}
.s-label{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-type{display:block;margin-top:1px;font-size:15px;line-height:20px;color:var(--label2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#box .dist{flex:none;font-size:15px;color:var(--label2);font-variant-numeric:tabular-nums}
#box li.head{min-height:44px;cursor:default;justify-content:space-between;padding:10px 14px 6px;font-size:15px;font-weight:600;color:var(--label2)}
#box li.head::before{display:none}
#box li.head + li::before{display:none}
#box li.head button{color:var(--tint);font-size:15px;font-weight:400}
#box li.msg{cursor:default;min-height:52px;justify-content:center;text-align:center;color:var(--label2);font-size:15px}
#box li.msg.err{color:var(--red)}

/* ============ Panneau du repère (feuille iOS) ============ */
#sheet{position:fixed;z-index:2000;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;border-radius:14px 14px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 16px);box-shadow:0 -10px 40px rgba(0,0,0,.45);background:rgba(28,28,30,.9);
  transform:translateY(110%);visibility:hidden;transition:transform .32s cubic-bezier(.4,0,1,1),visibility 0s .32s;will-change:transform}
#sheet.open{transform:none;visibility:visible;transition:transform .5s var(--ease),visibility 0s}
#sheet::before{content:"";display:block;width:36px;height:5px;margin:0 auto 10px;border-radius:3px;background:rgba(235,235,245,.3)}
.sh-head{display:flex;align-items:flex-start;gap:12px}
.sh-head .t{flex:1;min-width:0}
#st{margin:0;font-size:22px;line-height:28px;font-weight:700;overflow-wrap:anywhere}
#sl{margin:2px 0 0;color:var(--label2);font-size:15px;line-height:20px}
#close{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--label2)}
#close svg{width:12px;height:12px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:50px;border-radius:12px;font-size:17px;font-weight:600;margin-top:10px;transition:opacity .15s}
.btn:active{opacity:.6;transition:none}
.btn.primary{background:var(--tint);color:#fff}
.btn.gray{background:var(--fill);color:var(--tint)}
.group{margin-top:14px;border-radius:12px;overflow:hidden;background:var(--cell2)}
.cell{position:relative;width:100%;min-height:50px;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;font-size:17px}
.cell + .cell::before{content:"";position:absolute;top:0;right:0;left:16px;height:.5px;background:var(--sep)}
button.cell:active{background:#48484A}
.cell .k{flex:1;min-width:0}
.cell .k span{display:block;font-size:13px;color:var(--label2)}
.cell .k b{display:block;margin-top:1px;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.cell.act{color:var(--tint)}
.cell.red{color:var(--red)}
.cell .ic{width:22px;height:22px;flex:none}
.copy{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--tint)}
.copy svg{width:18px;height:18px}
.copy:active{opacity:.5}

/* ============ Appui long, astuce, bannière ============ */
#ring{position:fixed;z-index:1500;width:64px;height:64px;margin:-32px 0 0 -32px;border:3px solid var(--tint);border-radius:50%;pointer-events:none;opacity:0;animation:ring .4s linear .1s forwards}
@keyframes ring{0%{opacity:0;transform:scale(1.6)}25%{opacity:1}100%{opacity:1;transform:scale(.5)}}
.toast{position:fixed;z-index:1600;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);padding:12px 18px;border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.45);font-size:15px;font-weight:600;text-align:center;pointer-events:none}
#hint{font-weight:500}
#toast{z-index:2100;opacity:0;transform:translate(-50%,12px) scale(.96);transition:opacity .25s,transform .35s var(--ease)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#sheet.open ~ #toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 64px)}   /* panneau ouvert : la bannière passe en haut */
#attr{position:fixed;z-index:1400;left:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 4px);margin:0;font-size:10px;color:var(--label2)}
#attr a{color:var(--tint)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<section id="sheet" aria-live="polite" aria-labelledby="st">

    <button id="calc" class="btn primary" type="button">Calculer latitude et longitude</button>
    <button id="cancel" class="btn gray" type="button">Annuler</button>
  </div>
  <div id="s2" hidden>
    <div class="group">
      <div class="cell"><div class="k"><span>Latitude</span><b id="lat"></b></div><button class="copy" type="button" data-c="lat" aria-label="Copier la latitude"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8.5" y="8.5" width="12" height="12" rx="2.5"/><path d="M15.5 8.5V6A2.5 2.5 0 0 0 13 3.5H6A2.5 2.5 0 0 0 3.5 6v7A2.5 2.5 0 0 0 6 15.5h2.5"/></svg></button></div>
      <div class="cell"><div class="k"><span>Longitude</span><b id="lon"></b></div><button class="copy" type="button" data-c="lon" aria-label="Copier la longitude"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8.5" y="8.5" width="12" height="12" rx="2.5"/><path d="M15.5 8.5V6A2.5 2.5 0 0 0 13 3.5H6A2.5 2.5 0 0 0 3.5 6v7A2.5 2.5 0 0 0 6 15.5h2.5"/></svg></button></div>
    </div>
    <div class="group">
      <button id="copyBoth" class="cell act" type="button"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8.5" y="8.5" width="12" height="12" rx="2.5"/><path d="M15.5 8.5V6A2.5 2.5 0 0 0 13 3.5H6A2.5 2.5 0 0 0 3.5 6v7A2.5 2.5 0 0 0 6 15.5h2.5"/></svg>Copier « latitude, longitude »</button>
      <button id="remove" class="cell red" type="button"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14M10 10v6m4-6v6"/></svg>Retirer le repère</button>
    </div>
  </div>
</section>
<div id="toast" class="toast material" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/d3-array@3.2.4/dist/d3-array.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-geo@3.1.1/dist/d3-geo.min.js"></script>

<script>
const $ = id => document.getElementById(id);
const input = $("q"), box = $("box"), sheet = $("sheet"), hint = $("hint");
let dirty = true, cur = null;
const LAND = "#565c63", WATER = "#030b20", EDGE = "#2f62c9", D = Math.PI / 180;
const wrapLon = x => ((x + 540) % 360) - 180;
const fmt = v => v.toFixed(6).replace("-", "\u2212");
try{ if(localStorage.getItem("hintSeen")) hint.hidden = true; }catch(e){}

/*MVT-START*/
const utf8 = new TextDecoder();
function pb(buf, s, e, on){            // parcourt les champs d'un message protobuf
  let p = s;
  const vi = () => { let r = 0, m = 1, b; do{ b = buf[p++]; r += (b & 127) * m; m *= 128; }while(b & 128); return r; };
  while(p < e){
    const key = vi(), tag = Math.floor(key / 8), w = key % 8;
    if(w === 0) on(tag, vi(), p, p);
    else if(w === 2){ const n = vi(); on(tag, null, p, p + n); p += n; }
    else p += w === 1 ? 8 : 4;
  }
}
function packed(buf, s, e){
  const out = []; let p = s;
  while(p < e){ let r = 0, m = 1, b; do{ b = buf[p++]; r += (b & 127) * m; m *= 128; }while(b & 128); out.push(r); }
  return out;
}
function rings(buf, s, e){             // géométrie MVT : liste de tracés [x0,y0,x1,y1,...]
  const out = []; let p = s, x = 0, y = 0, cur = null;
  const vi = () => { let r = 0, m = 1, b; do{ b = buf[p++]; r += (b & 127) * m; m *= 128; }while(b & 128); return r; };
  const zz = n => n % 2 ? -(n + 1) / 2 : n / 2;
  while(p < e){
    const cmd = vi(), id = cmd % 8, n = Math.floor(cmd / 8);
    if(id === 7){ if(cur) cur.push(cur[0], cur[1]); continue; }
    for(let i = 0; i < n; i++){
      x += zz(vi()); y += zz(vi());
      if(id === 1){ cur = []; out.push(cur); }
      cur.push(x, y);
    }
  }
  return out;
}
const WANT = {water:1, boundary:1, transportation:1, place:1};  // on ignore tout le reste
function readTile(buf){
  const out = {};
  pb(buf, 0, buf.length, (t, v, s, e) => {
    if(t !== 3) return;
    let name = "";
    pb(buf, s, e, (t2, v2, s2, e2) => { if(t2 === 1) name = utf8.decode(buf.subarray(s2, e2)); });
    if(!WANT[name]) return;
    const keys = [], vals = [], fs = []; let ext = 4096;
    pb(buf, s, e, (t2, v2, s2, e2) => {
      if(t2 === 3) keys.push(utf8.decode(buf.subarray(s2, e2)));
      else if(t2 === 4){
        let val = null;
        pb(buf, s2, e2, (t3, v3, s3, e3) => {
          if(t3 === 1) val = utf8.decode(buf.subarray(s3, e3));
          else if(t3 === 6) val = v3 % 2 ? -(v3 + 1) / 2 : v3 / 2;
          else if(t3 === 7) val = v3 === 1;
          else if(t3 === 4 || t3 === 5) val = v3;
        });
        vals.push(val);
      }
      else if(t2 === 5) ext = v2;
      else if(t2 === 2) fs.push([s2, e2]);
    });
    out[name] = {ext, feats:fs.map(([a, b]) => {
      const f = {type:0, props:{}, g:[]}; let tg = [];
      pb(buf, a, b, (t3, v3, s3, e3) => {
        if(t3 === 3) f.type = v3;
        else if(t3 === 2) tg = packed(buf, s3, e3);
        else if(t3 === 4) f.g = rings(buf, s3, e3);
      });
      for(let i = 0; i + 1 < tg.length; i += 2) f.props[keys[tg[i]]] = vals[tg[i + 1]];
      return f;
    })};
  });
  return out;
}
function tileLL(tz, x, y, px, py, ext){
  const n = Math.pow(2, tz), fx = (x + px / ext) / n, fy = (y + py / ext) / n;
  return [Math.atan(Math.sinh(Math.PI * (1 - 2 * fy))) * 180 / Math.PI, fx * 360 - 180];
}
/*MVT-END*/

/* ================= Repère + panneau ================= */
function placePin(lat, lon, item){
  cur = {lat, lon:wrapLon(lon)};
  hint.hidden = true;
  try{ localStorage.setItem("hintSeen", "1"); }catch(e){}
  if(item){
    const [head, ...rest] = item.label.split(", ");
    $("st").textContent = head;
    $("sl").textContent = [item.type, rest.join(", ")].filter(Boolean).join(" \u00b7 ").slice(0, 90);
    showCoords();
  }else{

function dist(a, b){  // km entre deux points {lat, lon}
  const r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*r) * Math.cos(b.lat*r) * Math.sin(dLon/2)**2;
  return 12742 * Math.asin(Math.sqrt(h));
}

  if(d < 1) return Math.max(10, Math.round(d * 100) * 10) + " m";
  if(d < 10) return d.toFixed(1).replace(".", ",") + " km";
  return Math.round(d).toLocaleString("fr-FR") + " km";
}

function biasPoint(){
  const c = {lat:-phi, lon:wrapLon(-lam)};
  if(gz >= 3 && (!userPos || dist(userPos, c) >= 100)) return c;
  return userPos ? {lat:userPos.lat, lon:userPos.lon} : null;

async function searchPhoton(t, bias){
  let u = "https://photon.komoot.io/api/?limit=6&lang=fr&q=" + encodeURIComponent(t);
  if(bias) u += "&lat=" + bias.lat.toFixed(4) + "&lon=" + bias.lon.toFixed(4);
  const r = await fetch(u); if(!r.ok) throw new Error("Photon");
  return (await r.json()).features.map(f => {
    const p = f.properties || {};
    const street = [p.housenumber, p.street].filter(Boolean).join(" ");
    const parts = [p.name, street, p.district, p.postcode, p.city, p.state, p.country]
      .map(s => (s || "").toString().trim()).filter(Boolean);
    return {label:[...new Set(parts)].join(", "), type:TYPES[p.type] || "Lieu",
            lat:f.geometry.coordinates[1], lon:f.geometry.coordinates[0]};

async function searchBAN(t, bias){
  let u = "https://api-adresse.data.gouv.fr/search/?limit=5&q=" + encodeURIComponent(t);

async function searchSirene(t){
  const r = await fetch("https://recherche-entreprises.api.gouv.fr/search?per_page=5&q=" + encodeURIComponent(t));
  if(!r.ok) throw new Error("Entreprises");
  const out = [];
  for(const e of ((await r.json()).results || [])){
    const seen = new Set();
    for(const s of [e.siege, ...(e.matching_etablissements || [])].filter(Boolean)){
      const lat = parseFloat(s.latitude), lon = parseFloat(s.longitude);
      if(isNaN(lat) || isNaN(lon) || seen.has(s.siret)) continue;
      seen.add(s.siret); if(seen.size > 3) break;
      out.push({label:(e.nom_complet || "Entreprise") + ", " + (s.adresse || "").trim(),
        type:(s === e.siege ? "Entreprise (siège)" : "Entreprise (établissement)") + (s.etat_administratif === "F" ? ", fermé" : ""),
        lat, lon});

function merge(...lists){
  const out = [];
  for(const l of lists) for(const x of l)
    if(!out.some(y => Math.abs(y.lat - x.lat) < 0.0008 && Math.abs(y.lon - x.lon) < 0.0008)) out.push(x);
  return out.slice(0, 8);
}
async function fetchAll(t){
  const bias = biasPoint();
  const k = t + "|" + (bias ? bias.lat.toFixed(1) + "," + bias.lon.toFixed(1) : "");
  if(cache.k === k) return cache.items;
  const [p, b, e] = await Promise.allSettled([searchPhoton(t, bias), searchBAN(t, bias), searchSirene(t)]);
  if(p.status === "rejected" && b.status === "rejected" && e.status === "rejected") throw new Error("net");
  const v = x => x.status === "fulfilled" ? x.value : [];
  let items = /^\d/.test(t) ? merge(v(b), v(p), v(e)) : merge(v(p), v(e), v(b));
  if(bias){  // ce qui est à moins de 50 km passe devant, l'ordre reste le même sinon
    const near = items.filter(x => dist(bias, x) <= 50);
    items = [...near, ...items.filter(x => !near.includes(x))];
  }
  cache = {k, items};
  return items;
}

function makeStars(n, k, rMin, rMax, sparkle){
  const a = [];
  for(let i = 0; i < n; i++){
    const lat = Math.asin(2 * Math.random() - 1);
    a.push({lon:(Math.random() * 2 - 1) * Math.PI, sp:Math.sin(lat), cp:Math.cos(lat),
            r:rMin + Math.random() * (rMax - rMin), a:.35 + Math.random() * .65});

function drawStars(){

    for(const s of L.stars){

      ctx.globalAlpha = s.a * Math.min(1, z * 3);

}

  initTiles();
  const tz = Math.max(2, Math.min(14, Math.round(Math.log2(2 * Math.PI * R * gz / 256)) - 1)), want = new Map();
  for(let i = 0; i <= 5; i++) for(let j = 0; j <= 9; j++){
    const g = proj.invert([W * (-.1 + 1.2 * i / 5), H * (-.05 + 1.1 * j / 9)]);
    if(!g) continue;
    const [x, y] = lonLatToTile(g[0], g[1], tz);
    want.set(tkey(tz, x, y), [x, y]);
  }
  if(tz !== lastTz){ prevList = drawList.filter(t => t.tz !== tz); lastTz = tz; }
  const now = []; let missing = 0;
  for(const [, [x, y]] of want){
    const t = getTile(tz, x, y);
    if(t && t.quad) now.push(t); else missing++;
  }
  if(!missing) prevList = [];
  drawList = [...prevList, ...now].sort((a, b) => a.tz - b.tz);
  if(tiles.size > 90) for(const k of tiles.keys()){ if(tiles.size <= 70) break; if(!want.has(k)) tiles.delete(k); }
}

let K, c1, s1, c2, s2;       // rotation courante, appliquée à la main aux sommets (vecteurs unitaires)
function ring2(a, close){
  let on = false, lx = 0, ly = 0;
  for(let i = 0; i < a.length; i += 3){
    const x0 = a[i], y0 = a[i + 1], z0 = a[i + 2], t = x0 * c1 - y0 * s1;
    if(t * c2 - z0 * s2 <= 0){ on = false; continue; }
    const px = cx + K * (x0 * s1 + y0 * c1), py = cy - K * (z0 * c2 + t * s2);
    if(!on){ ctx.moveTo(px, py); on = true; }
    else if(Math.abs(px - lx) < .5 && Math.abs(py - ly) < .5) continue;
    else ctx.lineTo(px, py);
    lx = px; ly = py;
  }
  if(close && on) ctx.closePath();
}
function drawLabels(){
  const out = [], seen = new Set();
  for(const t of drawList) for(const p of t.places){
    const k = p.name + "|" + p.cls; if(seen.has(k)) continue;
    const x0 = p.v[0], y0 = p.v[1], z0 = p.v[2], tt = x0 * c1 - y0 * s1;
    if(tt * c2 - z0 * s2 <= 0) continue;
    const px = cx + K * (x0 * s1 + y0 * c1), py = cy - K * (z0 * c2 + tt * s2);
    if(px < -40 || px > W + 40 || py < -10 || py > H + 10) continue;
    seen.add(k); out.push({p, px, py, pr:PRIO[p.cls] ?? 4});
  }
  out.sort((a, b) => a.pr - b.pr || a.p.rank - b.p.rank);
  const boxes = [];
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineWidth = 3; ctx.strokeStyle = WATER; ctx.lineJoin = "round";
  for(const l of out){
    if(boxes.length >= 60) break;
    const up = l.pr <= 1, txt = up ? l.p.name.toUpperCase() : l.p.name;
    ctx.font = (up ? "600 12px " : l.pr === 2 ? "600 13px " : "500 11px ") + "-apple-system,system-ui,sans-serif";
    const w = ctx.measureText(txt).width + 6, h = 14, bx = l.px - w / 2, by = l.py - h / 2;
    if(boxes.some(b => bx < b[0] + b[2] && bx + w > b[0] && by < b[1] + b[3] && by + h > b[1])) continue;
    boxes.push([bx, by, w, h]);
    ctx.strokeText(txt, l.px, l.py);
    ctx.fillStyle = l.pr === 0 ? "#cfd8f2" : l.pr === 1 ? "#9aa8c7" : "#f2f6ff";
    ctx.fillText(txt, l.px, l.py);
  }
}
function drawDetail(){
  const a = lam * D, b = phi * D;
  K = R * gz; c1 = Math.cos(a); s1 = Math.sin(a); c2 = Math.cos(b); s2 = Math.sin(b);
  const wf = 1 + Math.min(2, Math.max(0, Math.log2(K * 2 * Math.PI / 256) - 12) * .2);
  ctx.lineJoin = ctx.lineCap = "round";
  for(const t of drawList){
    ctx.beginPath(); ring2(t.quad, true); ctx.fillStyle = t.empty ? WATER : LAND; ctx.fill();
    if(t.water.length){ ctx.beginPath(); for(const r of t.water) ring2(r, true); ctx.fillStyle = WATER; ctx.fill("evenodd"); }
    if(t.bound.length){ ctx.beginPath(); for(const r of t.bound) ring2(r, false); ctx.strokeStyle = EDGE; ctx.lineWidth = 1; ctx.stroke(); }
    for(const cl of ROAD_ORDER){
      const rs = t.roads[cl]; if(!rs) continue;
      ctx.beginPath(); for(const r of rs) ring2(r, false);
      ctx.strokeStyle = ROAD[cl][2]; ctx.lineWidth = ROAD[cl][1] * wf; ctx.stroke();
    }
  }
  drawLabels();
}

/* ---------- rendu du globe ---------- */
function drawGlobe(){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // « deep » = le globe recouvre tout l'écran. Avant, on peignait alors TOUT l'écran en gris (terre)
  // en attendant les tuiles : on croyait avoir plongé d'un coup tout près du sol.
  // Maintenant on garde toujours le fond de carte (océans + continents) sous les tuiles.
  const deep = R * gz > Rs;
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  if(gz <= 3.3) drawStars();
  if(deep){ ctx.fillStyle = WATER; ctx.fillRect(0, 0, W, H); }
  else{ ctx.beginPath(); gpath(SPHERE); ctx.fillStyle = WATER; ctx.fill(); }
  if(land){ ctx.beginPath(); gpath(land); ctx.fillStyle = LAND; ctx.fill(); }
  if(gz >= DETAIL) drawDetail();
  if(!deep){ ctx.beginPath(); gpath(SPHERE); ctx.strokeStyle = EDGE; ctx.lineWidth = 2; ctx.stroke(); }
  if(cur && d3.geoDistance([cur.lon, cur.lat], [-lam, -phi]) < Math.PI / 2 - .02){
    const p = proj([cur.lon, cur.lat]);
    if(p) ctx.drawImage(pinImg, p[0] - 15, p[1] - 38, 30, 39);
  }
}
function applyZoom(){
  proj.scale(R * gz);
  const small = gz <= 3.3;
  for(const id of ["halo", "shade"]){
    const e = $(id); e.style.display = small ? "block" : "none";
    if(small) e.style.transform = "translate(-50%,-50%) scale(" + gz + ")";
  }
  $("attr").hidden = !(gz >= DETAIL && tileUrl);
  dirty = true;
}
function resizeGlobe(){
  dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  gl.width = W * dpr; gl.height = H * dpr;
  R = Math.min(W * .4, H * .3); cx = W / 2; cy = H * .46;
  GZ_MAX = gzRaw(18);
  Rs = Math.hypot(W / 2, Math.max(cy, H - cy)) * 1.05;
  proj.translate([cx, cy]);
  for(const [id, k] of [["halo", 2.5], ["shade", 2]]){
    const e = $(id); e.style.width = e.style.height = R * k + "px"; e.style.left = cx + "px"; e.style.top = cy + "px";
  }
  applyZoom();
}

/* ---------- doigt : rotation, inertie, pincement, vol vers un lieu ---------- */
const IDLE = .004, reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let drag = null, vel = [0, 0], idleAt = 0, tween = null, pinch = null;
const ptrs = new Map();
function flyTo(lat, lon, gzT){
  const g1 = Math.max(GZ_MIN, Math.min(GZ_MAX, gzT || gz));
  tween = {l0:lam, p0:phi, dl:((-lon - lam + 540) % 360) - 180, dp:clampPhi(-lat) - phi,
           z0:Math.log(gz), dz:Math.log(g1) - Math.log(gz), t0:performance.now(),
           dur:Math.min(2400, 800 + 140 * Math.abs(Math.log2(g1 / gz)))};
  vel = [0, 0];
}
function zoomGlobe(g){ gz = Math.max(GZ_MIN, Math.min(GZ_MAX, g)); applyZoom(); }
/* Zoom ancré : le lieu sous les doigts (ou sous le curseur) reste sous les doigts.
   Avant, on zoomait toujours vers le centre de l'écran : le lieu visé « s'échappait »
   et, en zoomant beaucoup, on se retrouvait d'un coup très près d'un autre endroit. */
function geoAt(x, y){
  proj.rotate([lam, phi]);
  if(Math.hypot(x - cx, y - cy) > R * gz * .98) return null;      // hors du globe
  const g = proj.invert([x, y]);
  return g && isFinite(g[0]) && isFinite(g[1]) ? g : null;
}
function pinGeoTo(g, x, y){
  for(let i = 0; i < 4; i++){                    // 4 petites corrections suffisent (orthographique)
    proj.rotate([lam, phi]);
    const p = proj(g); if(!p) break;
    const k = 57.3 / (R * gz), dx = x - p[0], dy = y - p[1];
    if(Math.abs(dx) < .3 && Math.abs(dy) < .3) break;
    lam += dx * k; phi = clampPhi(phi - dy * k);
  }
  proj.rotate([lam, phi]); dirty = true;
}
function zoomAt(g, x, y){
  const anchor = geoAt(x, y);
  zoomGlobe(g);
  if(anchor) pinGeoTo(anchor, x, y);
}

gl.addEventListener("pointerdown", e => {
  gl.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  hideBox(); input.blur();
  if(ptrs.size === 2){
    const [a, b] = [...ptrs.values()], mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    // distance mini : deux doigts posés presque l'un sur l'autre ne doivent pas multiplier le zoom par 20
    pinch = {d0:Math.max(40, Math.hypot(a.x - b.x, a.y - b.y)), g0:gz, anchor:geoAt(mx, my)};
    drag = null; tween = null; vel = [0, 0]; cancelLP(); return;
  }
  if(ptrs.size > 2) return;
  drag = {x:e.clientX, y:e.clientY, t:performance.now()}; vel = [0, 0]; tween = null;
  const pt = [e.clientX, e.clientY];
  startLP(e, () => {
    if(Math.hypot(pt[0] - cx, pt[1] - cy) > R * gz) return;
    const g = proj.invert(pt);
    if(g){ placePin(g[1], g[0]); flyTo(g[1], g[0], null); }
  });
});
gl.addEventListener("pointermove", e => {
  const q = ptrs.get(e.pointerId); if(q){ q.x = e.clientX; q.y = e.clientY; }
  if(pinch && ptrs.size === 2){
    const [a, b] = [...ptrs.values()], mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    zoomGlobe(pinch.g0 * Math.max(40, Math.hypot(a.x - b.x, a.y - b.y)) / pinch.d0);
    if(pinch.anchor) pinGeoTo(pinch.anchor, mx, my);   // zoom + déplacement à deux doigts
    return;
  }
  if(!drag) return;
  if(lp && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > TOL) cancelLP();
  const now = performance.now(), dt = Math.max(1, now - drag.t), k = 57.3 / (R * gz);
  const dx = (e.clientX - drag.x) * k, dy = (e.clientY - drag.y) * k;
  lam += dx; phi = clampPhi(phi - dy);
  vel = [vel[0] * .6 + dx / dt * .4, vel[1] * .6 - dy / dt * .4];
  drag.x = e.clientX; drag.y = e.clientY; drag.t = now; dirty = true;
});
const lift = e => {
  ptrs.delete(e.pointerId); cancelLP();
  if(ptrs.size < 2) pinch = null;
  if(ptrs.size === 1){ const [q] = [...ptrs.values()]; drag = {x:q.x, y:q.y, t:performance.now()}; vel = [0, 0]; }
  else if(!ptrs.size) drag = null;
};
["pointerup", "pointercancel"].forEach(t => gl.addEventListener(t, lift));
gl.addEventListener("wheel", e => {
  e.preventDefault(); tween = null;
  // ctrlKey = pincement au trackpad (Chrome/Firefox) ; deltaMode 1 = lignes (souris Firefox)
  const d = Math.max(-200, Math.min(200, e.deltaY * (e.deltaMode === 1 ? 33 : 1)));
  zoomAt(gz * Math.exp(-d * (e.ctrlKey ? .01 : .0015)), e.clientX, e.clientY);
}, {passive:false});
/* Safari (Mac trackpad, iPhone) : gestes natifs. On bloque le zoom de la page partout ;
   sur le globe au trackpad Mac, on s'en sert pour zoomer (sur iPhone, les pointeurs s'en chargent). */
let gs = null;
document.addEventListener("gesturestart", e => {
  e.preventDefault();
  if(e.target === gl && ptrs.size < 2) gs = {g0:gz, x:e.clientX, y:e.clientY, anchor:geoAt(e.clientX, e.clientY)};
}, {passive:false});
document.addEventListener("gesturechange", e => {
  e.preventDefault();
  if(!gs || ptrs.size >= 2) return;
  tween = null; zoomGlobe(gs.g0 * e.scale);
  if(gs.anchor) pinGeoTo(gs.anchor, gs.x, gs.y);
}, {passive:false});
document.addEventListener("gestureend", e => { e.preventDefault(); gs = null; }, {passive:false});
// double appui : pas de zoom de page sur la barre ni le panneau
document.addEventListener("dblclick", e => { if(e.target !== input) e.preventDefault(); });

let prev = 0;
function frame(t){
  requestAnimationFrame(frame);
  const dt = Math.min(50, t - prev || 16); prev = t;
  if(tween){
    const u = Math.min(1, (performance.now() - tween.t0) / tween.dur), k = 1 - Math.pow(1 - u, 3);
    lam = tween.l0 + tween.dl * k; phi = tween.p0 + tween.dp * k;
    gz = Math.exp(tween.z0 + tween.dz * k); applyZoom();
    if(u >= 1) tween = null;
    idleAt = t + 3000;
  }else if(!drag && !pinch){
    const th = .002 / Math.max(1, gz);
    if(Math.abs(vel[0]) > th || Math.abs(vel[1]) > th){
      lam += vel[0] * dt; phi = clampPhi(phi + vel[1] * dt);
      const f = Math.pow(.95, dt / 16.7); vel[0] *= f; vel[1] *= f;
      idleAt = t + 2500; dirty = true;
    }else if(!reduce && gz < 2 && t > idleAt){ lam += IDLE * dt; dirty = true; }
  }
  if(dirty){
    dirty = false; proj.rotate([lam, phi]);
    if(gz >= DETAIL) updateTiles();
    drawGlobe();
  }
}
addEventListener("resize", resizeGlobe);
resizeGlobe();
requestAnimationFrame(frame);

fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-110m.json")
  .then(r => { if(!r.ok) throw 0; return r.json(); })
  .then(w => { land = topojson.feature(w, w.objects.land); dirty = true; })
  .catch(() => {});

</script>
